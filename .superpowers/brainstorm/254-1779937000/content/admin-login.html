<div class="section">
  <h3>登录逻辑</h3>
  <ul style="font-size:13px;color:#475569;">
    <li><strong>初期方案：</strong>前端硬编码管理员账号密码（如 admin / 123456），后续替换为后端 API 验证</li>
    <li><strong>登录状态：</strong>登录成功后 localStorage 存 token，后台页面检查 token 是否存在</li>
    <li><strong>安全性：</strong>初期仅做基础防护，后端接入后改为 JWT + 密码哈希</li>
    <li><strong>退出登录：</strong>后台页面右上角提供退出按钮，清除 token 返回登录页</li>
  </ul>
</div>
